# Render Blueprint — free demo hosting for the class presentation.
# NOTE: the Overview, Brands (and Brand 360), Pipeline, Finance, Inbox, Audience, Automation and Settings pages now read from the Go API in /backend, and this
# Node-only service does not run it, so those pages show "API isn't reachable" here. To host the demo,
# run both processes in one container: the Dockerfile in the project root does that (use `runtime: docker`, and a
# persistent disk mounted at /app/data to keep your data)
# or deploy the API as a second service and set API_URL on this one.
# The free plan has no persistent disk, so every start rebuilds the demo
# database from the seed (`start:demo`). Changes made in the app are lost
# when the service sleeps (after ~15 min idle) or redeploys.
services:
  - type: web
    name: creator-os
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm run start:demo
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "24"
